version: '3.9'

# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Hot reload: code changes immediately reflected without rebuild

services:
  reviewbot:
    build:
      target: dev
    environment:
      - GIN_MODE=debug
      - LOG_LEVEL=debug
    volumes:
      - ./service:/app
    command: ["air", "-c", ".air.toml"]

  reviewbot-ai:
    volumes:
      - ./ai:/app
    command: ["uvicorn", "reviewbot_ai.server:app", "--host", "0.0.0.0", "--port", "8081", "--reload"]